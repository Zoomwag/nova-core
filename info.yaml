# Tiny Tapeout project information
project:
  title:        "Nova Core"        
  author:       "Jonathan B"                      # TODO: put your name here
  discord:      ""                                # TODO: optional, your Discord username
  description:  "A small 16-bit accumulator-based CPU (ALU, RAM, program ROM) with an 8-bit multiplexed byte interface for loading input and reading output."
  language:     "Verilog"
  clock_hz:     10000000    # 10 MHz - conservative starting point, raise once you've checked timing

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your GitHub username:
  top_module:  "tt_um_zoomwag_cpu16"   # TODO: replace "yourusername"

  # List your project's source files here. Source files must be in ./src
  # and you must list each source file separately, one per line:
  source_files:
    - "cpu.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Dedicated inputs - byte to load into the CPU's 16-bit input register
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Dedicated outputs - byte selected by uio[1:0] (see below)
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Bidirectional pins - all used as extra control inputs
  uio[0]: "out_sel[0] - 00:main_output low byte 01:main_output high byte 10:pc_value"
  uio[1]: "out_sel[1]"
  uio[2]: "load_half - 0: low byte of input reg  1: high byte"
  uio[3]: "load_strobe - hold high for 1 clock to latch data_in into the selected half"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
